[project]
name = "mokuro-watcher"
version = "0.1.0"
description = "Roda o mokuro nos capítulos raw que o Kaizoku baixa e publica o resultado para o mokuro-reader"
requires-python = ">=3.11"

[project.scripts]
mokuro-watcher = "mokuro_watcher.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
